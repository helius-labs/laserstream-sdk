[package]
name = "laserstream-napi"
version = "0.7.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]
path = "napi-src/lib.rs"

[dependencies]
napi = { version = "2", features = ["async", "tokio_rt", "serde-json"] }
napi-derive = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.21"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tonic = { version = "0.11", features = ["transport", "tls", "tls-roots", "gzip", "zstd"] }
rustls = { version = "0.23", features = ["ring"] }
bytes = "1"
futures = "0.3"
futures-util = "0.3"
futures-channel = "0.3"
parking_lot = "0.12"
uuid = { version = "1", features = ["v4"] }
laserstream-core-client = "9.0.2"
# TEMP: laserstream-core-proto is yellowstone-grpc-proto published under a rename.
# Until a release with only_modified (= 31) ships, git-pin it to the YS branch
# over https (the repo is publicly fetchable, so CI needs no credentials). The
# dep-key alias keeps the `laserstream_core_proto::` import path.
# Revert to a crates.io version once that release is published.
laserstream-core-proto = { git = "https://github.com/helius-labs/yellowstone-grpc", branch = "cameron/only-modified-filter", package = "yellowstone-grpc-proto", default-features = false, features = ["tonic", "tonic-compression"] }
prost = "0.14"
bs58 = "0.5.0"
fastrand = "2.0"

[build-dependencies]
napi-build = "2"

[profile.release]
lto = false
opt-level = 3


[package.metadata.napi]
name = "laserstream-napi"
