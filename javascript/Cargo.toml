[package]
name = "laserstream-napi"
version = "0.0.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]
path = "napi-src/lib.rs"

[dependencies]
napi = { version = "2", features = ["async", "tokio_rt", "serde-json"] }
napi-derive = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.21"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
rustls = { version = "0.23", features = ["ring"] }
bytes = "1"
futures = "0.3"
futures-util = "0.3"
futures-channel = "0.3"
parking_lot = "0.12"
uuid = { version = "1", features = ["v4"] }
# Pinned to helius-labs/yellowstone-grpc#74 until laserstream-core 13.2.0 is on crates.io; restore `version = "13.2.0"` before release.
laserstream-core-client = { git = "https://github.com/helius-labs/yellowstone-grpc", rev = "d4f81fa5035396369562ae86098268a7646bd98a" }
laserstream-core-proto = { git = "https://github.com/helius-labs/yellowstone-grpc", rev = "d4f81fa5035396369562ae86098268a7646bd98a", default-features = false, features = ["tonic", "tonic-compression"] }
# RUSTSEC-2026-0258: floor the core client's tonic 0.14 graph at the 0.4.19 fix.
h2 = ">=0.4.19,<0.5"
prost = "0.14"
bs58 = "0.5.0"
fastrand = "2.0"

[build-dependencies]
napi-build = "2"

[profile.release]
lto = false
opt-level = 3


[package.metadata.napi]
name = "laserstream-napi"
