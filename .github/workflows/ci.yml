name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  release:
    types: [published]

env:
  DEBUG: napi:*
  APP_NAME: laserstream-napi
  MACOSX_DEPLOYMENT_TARGET: '10.13'

permissions:
  contents: read
  id-token: write

jobs:
  version-check:
    name: SDK versions match
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 scripts/release.py check-template
          python3 scripts/release.py render
          python3 scripts/release.py check

  release-policy:
    name: SDK release policy
    runs-on: ubuntu-latest
    needs: [version-check]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          python3 scripts/release.py check-template
          python3 scripts/release.py render
      - name: Enforce PR release policy
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          NO_RELEASE: ${{ contains(github.event.pull_request.labels.*.name, 'no-release') }}
        run: |
          args=(--base-sha "$BASE_SHA")
          if [ "$NO_RELEASE" = "true" ]; then
            args+=(--no-release)
          fi
          python3 scripts/release.py check-pr-policy "${args[@]}"

  rust-tests:
    name: Rust SDK tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - run: python3 ../scripts/release.py render
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust SDK build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/db/
            rust/target/
          key: rust-sdk-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock') }}
      - run: cargo test --locked --lib
      - run: cargo test --locked --lib --no-default-features
      - run: cargo test --locked --lib --features internal
      - run: cargo test --locked --lib --no-default-features --features internal
      # Compile-checks doc examples (e.g. the `no_run` example in src/unary.rs).
      - run: cargo test --locked --doc

  go-tests:
    name: Go SDK tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      # Root package only: examples/ and test/ hold multiple `main` programs per directory.
      - run: go vet .
      # Tests wait on signals; the timeout only backstops a signal that never comes.
      - run: go test -race -count=1 -timeout 2m .

  js-tests:
    name: JS SDK tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        working-directory: javascript
    steps:
      - uses: actions/checkout@v4
      - run: python3 ../scripts/release.py render
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            javascript/target/
          key: js-tests-cargo-${{ runner.os }}-${{ hashFiles('javascript/Cargo.lock') }}
          restore-keys: |
            js-tests-cargo-${{ runner.os }}-
      - run: npm install --ignore-scripts
      # Debug build: tests only need a loadable binding for the host platform.
      - run: npm run build:debug
      - run: npm run test:unary
      - run: npm run test:intra-slot
      - run: npm run test:cuckoo
      - run: npm run test:v1-config
      - run: npm run test:update-parent

  build:
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: macos-latest
            target: x86_64-apple-darwin
            build: npm run build -- --target x86_64-apple-darwin
          - host: macos-latest
            target: aarch64-apple-darwin
            build: npm run build -- --target aarch64-apple-darwin
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            docker: gnu
            build: npm run build -- --target x86_64-unknown-linux-gnu
          - host: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            docker: gnu
            build: npm run build -- --target aarch64-unknown-linux-gnu
          - host: ubuntu-latest
            target: x86_64-unknown-linux-musl
            docker: musl
            build: npm run build -- --target x86_64-unknown-linux-musl
          - host: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            docker: musl
            build: npm run build -- --target aarch64-unknown-linux-musl
    name: stable - ${{ matrix.settings.target }} - node@20
    runs-on: ${{ matrix.settings.host }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/release.py render
      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --ignore-scripts
        working-directory: javascript
      - name: Install cross-compilation toolchains
        if: matrix.settings.host == 'ubuntu-latest'
        run: |
          case ${{ matrix.settings.target }} in
            aarch64-unknown-linux-gnu)
              sudo apt-get update
              sudo apt-get install -y gcc-aarch64-linux-gnu
              ;;
          esac
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.settings.target }}
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            javascript/target/
          key: ${{ matrix.settings.target }}-cargo-${{ matrix.settings.host }}-${{ hashFiles('javascript/Cargo.lock') }}
          restore-keys: |
            ${{ matrix.settings.target }}-cargo-${{ matrix.settings.host }}-
            ${{ matrix.settings.target }}-cargo-
      # QEMU is only needed when the runner arch differs from the container arch
      # (x86 host building an arm64 container). Native aarch64 runners
      # (ubuntu-24.04-arm) run the arm64 container directly — no emulation.
      - name: Set up QEMU for cross-compilation
        if: matrix.settings.docker && matrix.settings.host == 'ubuntu-latest'
        uses: docker/setup-qemu-action@v3
      - name: Build in Docker (musl)
        if: matrix.settings.docker == 'musl'
        run: |
          docker run --rm \
            -v $(pwd):/workspace \
            --platform ${{ startsWith(matrix.settings.target, 'aarch64') && 'linux/arm64' || 'linux/amd64' }} \
            rust:alpine sh -c "
              apk add --no-cache nodejs npm musl-dev gcc g++ openssl-dev perl make python3 && \
              cd /workspace && \
              rustup target add ${{ matrix.settings.target }} && \
              npm install && \
              export CC=gcc && \
              export CXX=g++ && \
              export CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=gcc && \
              export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=gcc && \
              export RUSTFLAGS='-C target-feature=-crt-static' && \
              npm run build -- --target ${{ matrix.settings.target }} && \
              echo 'Build complete' && \
              ls -la *.node
            "
        working-directory: javascript
      - name: Build in Docker (gnu - older glibc 2.36 for compatibility)
        if: matrix.settings.docker == 'gnu'
        run: |
          docker run --rm \
            -v $(pwd):/workspace \
            --platform ${{ startsWith(matrix.settings.target, 'aarch64') && 'linux/arm64' || 'linux/amd64' }} \
            debian:bookworm sh -c "
              apt-get update && \
              apt-get install -y curl build-essential pkg-config libssl-dev perl make ca-certificates gnupg && \
              mkdir -p /etc/apt/keyrings && \
              curl -fsSL https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key | gpg --dearmor -o /etc/apt/keyrings/nodesource.gpg && \
              echo 'deb [signed-by=/etc/apt/keyrings/nodesource.gpg] https://deb.nodesource.com/node_20.x nodistro main' | tee /etc/apt/sources.list.d/nodesource.list && \
              apt-get update && \
              apt-get install -y nodejs && \
              curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y && \
              . \$HOME/.cargo/env && \
              cd /workspace && \
              rustup target add ${{ matrix.settings.target }} && \
              npm install && \
              npm run build -- --target ${{ matrix.settings.target }} && \
              echo 'Build complete' && \
              ls -la *.node
            "
        working-directory: javascript
      - name: Build
        if: ${{ !matrix.settings.docker }}
        run: ${{ matrix.settings.build }}
        shell: bash
        working-directory: javascript
        env:
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          TARGET_CC: ${{ matrix.settings.target == 'aarch64-unknown-linux-gnu' && 'aarch64-linux-gnu-gcc' || '' }}
      - name: Verify build output
        run: |
          if [ ! -f *.node ]; then
            echo "❌ Error: No .node file found after build"
            exit 1
          fi
          echo "✅ Build output verified: $(ls -la *.node)"
          
          # Note: musl binaries built in Alpine containers will have musl linking
          # The verification would need to run inside an Alpine container to check properly
          echo "ℹ️ Target: ${{ matrix.settings.target }}"
        working-directory: javascript
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bindings-${{ matrix.settings.target }}
          path: |
            javascript/**/*.node
          if-no-files-found: error

  publish:
    name: Publish all SDKs
    runs-on: ubuntu-latest
    needs: [version-check, release-policy, rust-tests, go-tests, js-tests, build]
    if: github.event_name == 'release'
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          python3 scripts/release.py check-template
          python3 scripts/release.py render
      - name: Validate release source
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: python3 scripts/release.py preflight-release --tag "$RELEASE_TAG" --sha "$GITHUB_SHA"
      - uses: dtolnay/rust-toolchain@stable
      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org/
      - name: Install dependencies
        run: npm install --ignore-scripts
        working-directory: javascript
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Pre-pack every registry artifact
        run: python3 scripts/release.py prepare-release --artifacts artifacts --output release-packages --sha "$GITHUB_SHA" --allow-dirty
      - name: Authenticate to crates.io
        id: crates-auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      - name: Publish npm packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: python3 scripts/release.py publish-npm --packages release-packages --sha "$GITHUB_SHA"
      - name: Publish Rust SDK
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-auth.outputs.token }}
        run: python3 scripts/release.py publish-rust --sha "$GITHUB_SHA" --allow-dirty
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - name: Publish Go SDK tag
        run: python3 scripts/release.py publish-go --sha "$GITHUB_SHA"
      - name: Verify publication and provenance
        run: python3 scripts/release.py verify-release --sha "$GITHUB_SHA"